name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  playwright_test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    environment: CI

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v7
        with:
          path: frontend

      - name: Checkout backend repo
        uses: actions/checkout@v7
        with:
          repository: codewithsyahda/gkeep-clone-backend-nodejs-fastify
          path: backend

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: cd backend && pnpm ci

      - name: Generate backend Prisma client
        run: cd backend && pnpm dlx prisma generate
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/db_e2e?schema=public'

      - name: Backend Prisma migrate deploy
        run: cd backend && pnpm dlx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/db_e2e?schema=public'

      - name: Build backend
        run: cd backend && pnpm run build

      - name: Run backend application
        run: cd backend && pnpm run start:e2e &
        env:
          NODE_ENV: ci
          PORT: 5000
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:5000
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/db_e2e?schema=public'

      - name: Check backend application
        run: pnpm dlx wait-on http-get://localhost:5000/api/v1/auth/ok -t 30000

      - name: Run backend helper application
        run: cd backend && pnpm run dev:e2e &
        env:
          NODE_ENV: ci
          PORT_E2E: 5010
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/db_e2e?schema=public'

      - name: Check backend helper application
        run: pnpm dlx wait-on http-get://localhost:5010/api/health/liveness -t 30000

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Install Playwright Browsers
        run: cd frontend && pnpm exec playwright install --with-deps

      - name: Build frontend
        run: cd frontend && pnpm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1

      - name: Run Playwright tests
        run: cd frontend && pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          E2E_API_HELPER_BASE_URL: http://localhost:5010/api

      - name: Upload Playwright blob report to GAs Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-report-${{ matrix.shardIndex }}
          path: playwright-blob-report
          retention-days: 1

  merge_reports:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: [playwright_test]

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Download Playwright blob reports from GAs Artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-playwright-blob-reports
          pattern: playwright-blob-report-*
          merge-multiple: true

      - name: Merge all Playwright reports into HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-playwright-blob-reports

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
