name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://example.com/api/v1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm with Node.js runtime
        uses: pnpm/setup@v3
        with:
          version: ^12.21.0
          runtime: node@24
          cache: true

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run linter
        run: pnpm run lint

      - name: Run unit and integration testing
        run: pnpm run test:ci

      - name: Run build
        run: pnpm run build
